name: Update HaGeZi .dat lists

on:
  schedule:
    - cron: "17 4 */3 * *"

  workflow_dispatch:
    inputs:
      lists:
        description: "Списки для сборки (pro,pro-plus,ultimate)"
        required: false
        default: "pro,pro-plus,ultimate"
        type: string
      allow_build:
        description: "Разрешить сборку dlc из исходников, если бинарника нет"
        required: false
        default: true
        type: boolean
      force:
        description: "Пересобрать заново, сбросив сохранённое состояние"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: hagezi-dlc-update
  cancel-in-progress: false

jobs:
  update:
    name: Build and update HaGeZi lists
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Go
        if: github.event_name == 'schedule' || inputs.allow_build
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Force fresh build
        if: inputs.force == true
        shell: bash
        run: rm -f state/hagezi-dlc.json

      - name: Build lists and commit changes
        shell: bash
        env:
          LISTS: ${{ inputs.lists }}
          ALLOW_BUILD: ${{ inputs.allow_build }}
        run: |
          set -euo pipefail
          args=(--repo-root . --commit --push --branch "$GITHUB_REF_NAME")

          # For scheduled runs always permit building dlc. For manual runs,
          # respect the allow_build input (defaults to true).
          if [[ "$GITHUB_EVENT_NAME" == "schedule" || "$ALLOW_BUILD" == "true" ]]; then
            args+=(--allow-build)
          fi

          if [[ -n "$LISTS" ]]; then
            args+=(--lists "$LISTS")
          fi

          python scripts/build_dlc.py "${args[@]}"

      # Публикуем все имеющиеся .dat в одном постоянном GitHub Release.
      # Повторный запуск заменяет одноимённые assets свежими файлами.
      - name: Publish DAT files to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: hagezi-dat
          target_commitish: ${{ github.event.repository.default_branch }}
          name: HaGeZi DNS blocklists (.dat) — latest
          body: |
            Автоматически собранные geosite .dat-файлы из списков HaGeZi.

            При каждом успешном запуске workflow файлы в этом релизе обновляются.
          files: dat/*.dat
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
